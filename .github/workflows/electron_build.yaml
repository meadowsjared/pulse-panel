name: Build and Release Pulse Panel

on:
  push:
    branches:
      - main  # Set this to the branch you want to build from

jobs:
  build-and-release:
    runs-on: windows-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-modules-${{ hashFiles('bun.lock') }}

      - name: Cache Electron & electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies with Bun
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build Electron app with Bun
        run: |
          bun run build -p never

      - name: Read json
        id: read-json
        shell: pwsh
        run: |
          $json = Get-Content package.json | ConvertFrom-Json
          echo "VERSION=$($json.version)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate Release Notes
        shell: pwsh
        run: |
          git fetch --tags --force
          $tags = git tag --sort=-v:refname
          $prevTag = $tags | Where-Object { $_ -ne "v$($env:VERSION)" } | Select-Object -First 1

          $body = @()
          $body += "## What's Changed"

          if ($prevTag) {
            $commits = git log "$prevTag..HEAD" --no-merges --pretty=format:"* %s (%h)" | Where-Object { $_ -and $_ -notmatch '\[skip ci\]' }
            if ($commits) {
              $body += $commits
            } else {
              $body += "* Miscellaneous improvements and bug fixes"
            }
            $body += ""
            $body += "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prevTag...v${{ env.VERSION }}"
          } else {
            $commits = git log HEAD --no-merges --pretty=format:"* %s (%h)" | Where-Object { $_ -and $_ -notmatch '\[skip ci\]' }
            if ($commits) {
              $body += $commits
            }
          }

          $body -join "`n" | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1.14.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub automatically creates this secret to use in your workflow
        with:
          artifacts: ./release/${{ env.VERSION }}/pulse-panel_${{ env.VERSION }}.exe
          name: Pulse Panel v${{ env.VERSION }}
          draft: false
          prerelease: false
          bodyFile: release_notes.md
          tag: v${{ env.VERSION }}
          allowUpdates: true

      - name: Submit to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: JaredMeadows.pulse-panel
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Bump version with Bun
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $parts = $pkg.version.Split('.')

          if ($parts.Count -ne 3) {
            throw "Expected semver x.y.z, got $($pkg.version)"
          }

          $parts[2] = [int]$parts[2] + 1
          $pkg.version = "$($parts[0]).$($parts[1]).$($parts[2])"

          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json

      - name: Commit and push version bump
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "ci: version bump to $version [skip ci]"
          git push
